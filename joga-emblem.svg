<!-- joga-emblem.svg — Emblema JOGA: 3 chevrones ascendentes en círculo partido, degradado dorado.
     Para favicon/íconos. Vectorial, ~1-2KB, nítido a cualquier tamaño.
     JOGA emblem: 3 rising chevrons inside a split circle, gold gradient.
     For favicon/icons. Vector, ~1-2KB, crisp at any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="JOGA">
  <defs>
    <linearGradient id="jogaOroEmblem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a24"/>
      <stop offset=".26" stop-color="#e7c46a"/>
      <stop offset=".47" stop-color="#fff6dc"/>
      <stop offset=".68" stop-color="#dfb85c"/>
      <stop offset="1" stop-color="#9a7a2e"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="44" stroke="url(#jogaOroEmblem)" stroke-width="8"
          stroke-dasharray="124 14" stroke-dashoffset="-7"/>
  <g stroke="url(#jogaOroEmblem)" stroke-width="7.5">
    <path d="M42 52 L60 34 L78 52"/>
